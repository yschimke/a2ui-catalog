name: Compose Preview Publish

# The write half of compose-preview.yml's pull-request lane: downloads the render job's handoff and
# posts the visual-diff comment. Runs on `workflow_run`, so it has write access and ARTIFACTS_TOKEN
# but never executes the pull request's code.

on:
  workflow_run:
    workflows: [Compose Preview]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose-preview-handoff
          path: _compose_preview_handoff
          run-id: ${{ github.event.workflow_run.id }}
          # `run-id` is ignored without a token: the action then looks in THIS run, finds no
          # handoff, and fails with "Artifact not found".
          github-token: ${{ github.token }}
      - id: pr
        run: echo "number=$(cat _compose_preview_handoff/_pr_number)" >> "$GITHUB_OUTPUT"
      - uses: yschimke/compose-ai-tools/.github/actions/apply@315352b687f05d2d0e40cdec2d833271088dec12 # v2.67.0
        with:
          phase: publish
          pr-number: ${{ steps.pr.outputs.number }}
          artifact-repository: yschimke/a2ui-catalog-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}
